services:
  mysql:
    image: mysql:8.4
    container_name: plateforme-missions-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plateforme_missions
    ports:
      - "3306:3306"
    volumes:
      - mysql_missions_data:/var/lib/mysql

volumes:
  mysql_missions_data:
